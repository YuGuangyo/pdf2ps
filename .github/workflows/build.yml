name: build-mipsel

on:
  push:
  workflow_dispatch:

env:
  # 用 cross-tools/musl-cross 的 GitHub Releases 制品，而不是 musl.cc：
  #   1) 托管在 GitHub 上，Actions runner 下载又快又稳，不受 musl.cc 网络问题影响
  #   2) 只有 61MB，比 musl.cc 的 101MB 小
  #   3) 自带 .sha256 校验文件
  TC_URL: https://github.com/cross-tools/musl-cross/releases/download/20250928/mipsel-unknown-linux-muslsf.tar.xz
  TC_SHA_URL: https://github.com/cross-tools/musl-cross/releases/download/20250928/mipsel-unknown-linux-muslsf.tar.xz.sha256
  TC_DIR: mipsel-unknown-linux-muslsf
  TC_GCC: mipsel-unknown-linux-muslsf-gcc-15.2.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 缓存 .tar.xz 压缩包本身（61MB），而不是解压后上万文件的目录。
      # 缓存目录会让 post-job 的打包+上传阶段跑十几分钟并最终超时。
      - name: Cache toolchain archive
        uses: actions/cache@v4
        with:
          path: tc.tar.xz
          key: musl-cross-mipsel-muslsf-20250928

      - name: Fetch toolchain
        run: |
          set -euo pipefail
          if [ -s tc.tar.xz ] && xz -t tc.tar.xz 2>/dev/null; then
            echo "archive restored from cache (xz integrity OK)"
          else
            rm -f tc.tar.xz
            curl -fSL --retry 5 --retry-connrefused --retry-delay 3 \
                 --connect-timeout 20 -o tc.tar.xz "$TC_URL"
            curl -fSL --retry 5 --retry-connrefused --retry-delay 3 \
                 --connect-timeout 20 -o tc.sha256 "$TC_SHA_URL"
            # 发行版里的 .sha256 只有裸哈希值，没有文件名；
            # sha256sum -c 需要 "哈希  文件名" 格式，补上文件名再做校验。
            EXPECT=$(tr -d '[:space:]' < tc.sha256)
            echo "$EXPECT  tc.tar.xz" > tc.check
            echo "expected: $EXPECT"
            echo "actual:   $(sha256sum tc.tar.xz | cut -d' ' -f1)"
            sha256sum -c tc.check || {
              echo "checksum mismatch, re-downloading once"
              rm -f tc.tar.xz
              curl -fSL --retry 5 --retry-connrefused -o tc.tar.xz "$TC_URL"
              sha256sum -c tc.check
            }
          fi
          ls -l tc.tar.xz
          xz -t tc.tar.xz
          # 不要保留归档里的属主/权限位：runner 用户不是 root，保留 755+root
          # 会让后续任何写入该树的操作失败。
          tar xJf tc.tar.xz --no-same-owner
          # 确保工具可执行、目录可写，避免权限位带来的意外失败
          chmod -R u+rwX "$TC_DIR"
          find "$TC_DIR/bin" -maxdepth 1 -type f -exec chmod +x {} +
          # bin/ 里既有带版本号的真实文件，也有裸名 gcc 软链接
          ls -1 "$TC_DIR/bin/" | head -20
          "$TC_DIR/bin/$TC_GCC" --version | head -1

      - name: Compile pdftops-lite
        run: |
          set -euo pipefail
          # 归档里的 bin/ 保持 755、属主 root，任务用户无法在其中建软链接
          # （曾因此报 `ln: Permission denied`），所以直接调用带版本号的文件。
          CC=$PWD/"$TC_DIR/bin/$TC_GCC"
          ls -l "$CC"
          "$CC" --version | head -1
          # psgen.c 包含 <math.h>，静态链接时把 -lm 带上更保险
          # 三元组 mipsel-... 已隐含小端，无需 -EL
          "$CC" -O2 -Wall -Wextra -static \
              -o pdftops-lite \
              buf.c pdfobj.c psgen.c pdfimage.c main.c -lm
          file pdftops-lite || true
          ls -lh pdftops-lite
          # 打印 ELF 头 e_flags，应与路由器 /usr/sbin/cupsd 的 0x00200034 一致
          # （O32 ABI + FP32 软浮点 + MIPS32R2）
          echo -n "e_flags bytes: "
          od -An -tx1 -j36 -N4 pdftops-lite

      - name: Sanity check generated PostScript on a tiny PDF
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static

          # Build a *valid* PDF: the xref table needs real byte offsets, so
          # emit objects first and record their positions as we go.
          python3 - <<'PY'
          objs = []
          objs.append(b"<< /Type /Catalog /Pages 2 0 R >>")
          objs.append(b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>")
          objs.append(b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] "
                      b"/Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>")
          content = b"BT /F1 24 Tf 72 700 Td (Hello M401) Tj ET\n"
          objs.append(b"<< /Length %d >>\nstream\n" % len(content) + content + b"endstream")
          objs.append(b"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>")

          out = bytearray(b"%PDF-1.4\n")
          offsets = []
          for i, body in enumerate(objs, start=1):
              offsets.append(len(out))
              out += b"%d 0 obj\n" % i + body + b"\nendobj\n"
          xref_at = len(out)
          out += b"xref\n0 %d\n" % (len(objs) + 1)
          out += b"0000000000 65535 f \n"
          for off in offsets:
              out += b"%010d 00000 n \n" % off
          out += b"trailer\n<< /Size %d /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF\n" % (
              len(objs) + 1, xref_at)
          open("tiny.pdf", "wb").write(bytes(out))
          print("tiny.pdf:", len(out), "bytes, xref at", xref_at)
          PY

          PDFTOPS_DEBUG=1 qemu-mipsel-static ./pdftops-lite tiny.pdf > tiny.ps
          echo "--- generated PostScript (first 25 lines) ---"
          head -25 tiny.ps
          head -1 tiny.ps | grep -q '%!PS' && echo "OK: valid PostScript header"
          grep -q 'Hello M401' tiny.ps && echo "OK: text survived the round trip"

          # Also exercise the no-trailer fallback path with a truncated file.
          printf '%%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Contents 4 0 R>>endobj\n4 0 obj<</Length 44>>stream\nBT /F1 24 Tf 72 700 Td (NoTrailer) Tj ET\nendstream\nendobj\n' > broken.pdf
          if qemu-mipsel-static ./pdftops-lite broken.pdf > broken.ps; then
            echo "OK: catalog located without a trailer"
            grep -q 'NoTrailer' broken.ps && echo "OK: broken-file text emitted"
          else
            echo "NOTE: no-trailer file rejected (acceptable)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pdftops-lite-mipsel
          path: pdftops-lite
          if-no-files-found: error
